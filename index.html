<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Nav Page</title>
    <style>
        body { font-family: Arial, Helvetica, sans-serif; margin: 0; }
        header { background: #333; color: #fff; }
        .nav { display:flex; align-items:center; justify-content:space-between; max-width:1000px; margin:0 auto; padding:0.6rem 1rem; }
        .brand { font-weight:700; font-size:1.1rem; }
        .nav-links { list-style:none; display:flex; gap:1rem; margin:0; padding:0; }
        .nav-links a { color:#fff; text-decoration:none; padding:0.4rem 0.6rem; border-radius:4px; }
        .nav-links a:hover { background: rgba(255,255,255,0.08); }
        @media (max-width:600px) {
            .nav { flex-direction:column; align-items:flex-start; gap:0.5rem; }
            .nav-links { flex-direction:column; width:100%; }
            .nav-links a { display:block; width:100%; }
        }
        main { max-width:1000px; margin:2rem auto; padding:0 1rem; }
    </style>
</head>
<body>
    <header>
        <div class="nav">
            <div class="brand">MySite</div>
            <ul class="nav-links">
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Services</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </div>
    </header>
    <main>
        <h1>Welcome</h1>
        <p>This is a simple page with a responsive navigation bar.</p>
    </main>
</body>
</html>
